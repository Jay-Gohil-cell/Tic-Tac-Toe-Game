<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2 class="winner">Best of Luck !</h2>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <button class="btn-reset">Reset Game</button>
    <div class="inst">
        <ul>
            <h3>How to Play</h3>
            <li>Player X starts first</li>
            <li>Click on any box to make your move</li>
            <li>First player to get 3 in a row wins</li>
            <li>Click Reset to play again</li>
        </ul>
    </div>    

    <script src="script.js"></script>
</body>

</html>
